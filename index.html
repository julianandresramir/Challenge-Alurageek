<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alura Geek - Razas de Perros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <img src="image.png" alt="Logo" id="logo">  
    <header>
      <h1>Alura Geek - Razas de Perros</h1>
    </header>
    <main>
        <section id="lista-razas">
            <h2>Lista de Razas de Perros</h2>
            <ul id="razas">
                <!-- Razas de perros se agregarán aquí -->
          
            </ul>
        </section>
        <section id="agregar-raza">
            <h2>Agregar Raza</h2>
            <form id="form-raza">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="imagen">Imagen URL:</label>
                <input type="url" id="imagen" name="imagen" required>
                <button type="submit">Agregar</button>
                <button type="button" id="limpiar">Limpiar</button>
            </form>
        </section>
    </main>
    <footer> <img src="ALURA LATAM-2025.png" alt="Footer Imagen" id="footer-imagen"> </footer>
    <script src="script.js"></script>
</body>
</html>
